<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%">
  <defs>
    <!-- Dark Tactical Map Background -->
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B101D"/>
      <stop offset="50%" stop-color="#0E1628"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>

    <!-- Glowing Node Gradients -->
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>

    <linearGradient id="pandalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#880E4F"/>
    </linearGradient>

    <linearGradient id="melaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>

    <linearGradient id="craftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76FF03"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>

    <linearGradient id="heritageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="700" fill="url(#mapBg)"/>

  <!-- Blueprint Grid Pattern -->
  <g stroke="rgba(255, 179, 0, 0.08)" stroke-width="1">
    <line x1="0" y1="100" x2="1100" y2="100"/>
    <line x1="0" y1="200" x2="1100" y2="200"/>
    <line x1="0" y1="300" x2="1100" y2="300"/>
    <line x1="0" y1="400" x2="1100" y2="400"/>
    <line x1="0" y1="500" x2="1100" y2="500"/>
    <line x1="0" y1="600" x2="1100" y2="600"/>
    <line x1="150" y1="0" x2="150" y2="700"/>
    <line x1="300" y1="0" x2="300" y2="700"/>
    <line x1="450" y1="0" x2="450" y2="700"/>
    <line x1="600" y1="0" x2="600" y2="700"/>
    <line x1="750" y1="0" x2="750" y2="700"/>
    <line x1="900" y1="0" x2="900" y2="700"/>
  </g>

  <!-- Title & Header Bar -->
  <rect x="30" y="25" width="1040" height="55" rx="8" fill="#131C30" stroke="#FFB300" stroke-width="1.5"/>
  <text x="50" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#FFD54F">
    🗺️ DHANBAD DURGA PUJA 3D • WORLD MAP & SPATIAL TOPOLOGY
  </text>
  <text x="760" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#81D4FA">
    SCALE: 1:1 WALKING METRIC (3-5 MIN LOOPS)
  </text>

  <!-- CONNECTING ROADS & ARTERIAL HIGHWAYS -->
  <!-- North Road: Hub to Light Tunnel to Housing Pandal -->
  <path d="M550,370 L550,250 L550,140" stroke="#374151" stroke-width="28" stroke-linecap="round"/>
  <path d="M550,370 L550,250 L550,140" stroke="#FFB300" stroke-width="2" stroke-dasharray="8, 6"/>

  <!-- East Road: Hub to Mega Mela -->
  <path d="M550,370 L830,370" stroke="#374151" stroke-width="24" stroke-linecap="round"/>
  <path d="M550,370 L830,370" stroke="#00E5FF" stroke-width="2" stroke-dasharray="8, 6"/>

  <!-- West Road: Hub to Jharudih Craft Lane -->
  <path d="M550,370 L260,370" stroke="#374151" stroke-width="22" stroke-linecap="round"/>
  <path d="M550,370 L260,370" stroke="#76FF03" stroke-width="2" stroke-dasharray="8, 6"/>

  <!-- South Road: Hub to Purana Bazar & Heritage Lane -->
  <path d="M550,370 L550,560" stroke="#374151" stroke-width="24" stroke-linecap="round"/>
  <path d="M550,370 L550,560" stroke="#FF9100" stroke-width="2" stroke-dasharray="8, 6"/>

  <!-- Expansion Arteries (Dotted) -->
  <path d="M830,370 Q950,420 1020,470" stroke="#9E9E9E" stroke-width="8" stroke-dasharray="6, 6"/>
  <path d="M550,560 L550,650" stroke="#9E9E9E" stroke-width="8" stroke-dasharray="6, 6"/>

  <!-- 1. CENTRAL FESTIVAL HUB (Center) -->
  <g transform="translate(550, 370)">
    <circle cx="0" cy="0" r="55" fill="url(#hubGrad)" opacity="0.25" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="42" fill="#1A243D" stroke="#FFB300" stroke-width="3"/>
    <text x="0" y="-8" text-anchor="middle" font-size="24">🪔</text>
    <text x="0" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFD54F">CENTRAL HUB</text>
    <text x="0" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#E0E0E0">(0, 0, 0) • Spawn</text>

    <!-- Landmark Annotation Card -->
    <g transform="translate(-140, 48)">
      <rect width="130" height="52" rx="6" fill="#131C30" stroke="#FFB300" stroke-width="1"/>
      <text x="8" y="18" font-size="10" font-weight="700" fill="#FFD54F">📍 Welcome Toran</text>
      <text x="8" y="32" font-size="9" fill="#FFF">👤 Aheli (Volunteer)</text>
      <text x="8" y="44" font-size="9" fill="#90CAF9">📖 Passport Stamp #1</text>
    </g>
  </g>

  <!-- 2. ILLUMINATED LIGHT TUNNEL (North Mid) -->
  <g transform="translate(550, 245)">
    <rect x="-35" y="-30" width="70" height="60" rx="8" fill="#2A1B3D" stroke="#E040FB" stroke-width="2" filter="url(#glow)"/>
    <text x="0" y="-6" text-anchor="middle" font-size="20">✨</text>
    <text x="0" y="14" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#E040FB">LIGHT TUNNEL</text>
    <text x="0" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#DDD">40m LED Arches</text>
  </g>

  <!-- 3. HOUSING COLONY PANDAL (P0 Hero Showpiece - North) -->
  <g transform="translate(550, 135)">
    <circle cx="0" cy="0" r="70" fill="url(#pandalGrad)" opacity="0.3" filter="url(#glow)"/>
    <rect x="-65" y="-45" width="130" height="85" rx="10" fill="#20101E" stroke="#FF1744" stroke-width="3"/>
    <text x="0" y="-12" text-anchor="middle" font-size="28">🏛️</text>
    <text x="0" y="14" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FF8A80">HOUSING COLONY</text>
    <text x="0" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#FFD54F">GRAND PANDAL (P0)</text>

    <!-- Annotation Card -->
    <g transform="translate(75, -35)">
      <rect width="165" height="74" rx="6" fill="#1A1320" stroke="#FF1744" stroke-width="1.2"/>
      <text x="10" y="18" font-size="10" font-weight="700" fill="#FF8A80">🔱 Pratima Sanctum Altar</text>
      <text x="10" y="34" font-size="9" fill="#FFF">🪷 Interactive Pushpanjali</text>
      <text x="10" y="48" font-size="9" fill="#FFF">🥁 Dhak Proximity Peak (0m)</text>
      <text x="10" y="62" font-size="9" fill="#FFD54F">🏆 Pandal Passport Stamp #2</text>
    </g>
  </g>

  <!-- 4. MEGA MELA & FAIRGROUND (East) -->
  <g transform="translate(830, 370)">
    <circle cx="0" cy="0" r="75" fill="url(#melaGrad)" opacity="0.25" filter="url(#glow)"/>
    <rect x="-65" y="-50" width="130" height="100" rx="10" fill="#0C1B2E" stroke="#00E5FF" stroke-width="3"/>
    <text x="0" y="-15" text-anchor="middle" font-size="30">🎡</text>
    <text x="0" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#00E5FF">MEGA MELA</text>
    <text x="0" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#B3E5FC">Jhula, Games & Food</text>

    <!-- Sub-activities Pills -->
    <g transform="translate(-50, 60)">
      <rect width="100" height="24" rx="4" fill="#0277BD"/>
      <text x="50" y="16" text-anchor="middle" font-size="9" font-weight="700" fill="#FFF">🎡 24m Giant Wheel</text>
    </g>
    <g transform="translate(75, -50)">
      <rect width="160" height="85" rx="6" fill="#0B1A28" stroke="#00E5FF" stroke-width="1.2"/>
      <text x="10" y="18" font-size="10" font-weight="700" fill="#00E5FF">👤 Imran (Ride Operator)</text>
      <text x="10" y="34" font-size="9" fill="#FFF">🎯 Ring Toss Game Stall</text>
      <text x="10" y="48" font-size="9" fill="#FFF">🍯 Rupa's Food Lane (Jalebi)</text>
      <text x="10" y="62" font-size="9" fill="#FFF">🥁 Dhak Rhythm Challenge</text>
      <text x="10" y="76" font-size="9" fill="#81D4FA">📖 Passport Stamp #3</text>
    </g>
  </g>

  <!-- 5. JHARUDIH CRAFT LANE (West) -->
  <g transform="translate(260, 370)">
    <circle cx="0" cy="0" r="65" fill="url(#craftGrad)" opacity="0.25" filter="url(#glow)"/>
    <rect x="-60" y="-45" width="120" height="90" rx="10" fill="#132414" stroke="#76FF03" stroke-width="3"/>
    <text x="0" y="-12" text-anchor="middle" font-size="28">🪷</text>
    <text x="0" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#76FF03">JHARUDIH</text>
    <text x="0" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#C8E6C9">Artisan Craft Court</text>

    <g transform="translate(-175, -35)">
      <rect width="160" height="74" rx="6" fill="#0E1D10" stroke="#76FF03" stroke-width="1.2"/>
      <text x="10" y="18" font-size="10" font-weight="700" fill="#76FF03">👤 Madan da (Craftsman)</text>
      <text x="10" y="34" font-size="9" fill="#FFF">🎋 Bamboo & Fabric Workshop</text>
      <text x="10" y="48" font-size="9" fill="#FFF">🔍 3 Golden Lotus Quest</text>
      <text x="10" y="64" font-size="9" fill="#A5D6A7">📖 Passport Stamp #4</text>
    </g>
  </g>

  <!-- 6. PURANA BAZAR & HERITAGE LANE (South) -->
  <g transform="translate(550, 560)">
    <circle cx="0" cy="0" r="65" fill="url(#heritageGrad)" opacity="0.25" filter="url(#glow)"/>
    <rect x="-65" y="-45" width="130" height="85" rx="10" fill="#24140D" stroke="#FF9100" stroke-width="3"/>
    <text x="0" y="-12" text-anchor="middle" font-size="28">🏮</text>
    <text x="0" y="14" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFB74D">HERITAGE LANE</text>
    <text x="0" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#FFE0B2">Purana Bazar & Memories</text>

    <g transform="translate(75, -25)">
      <rect width="165" height="60" rx="6" fill="#1C100A" stroke="#FF9100" stroke-width="1.2"/>
      <text x="10" y="18" font-size="10" font-weight="700" fill="#FFB74D">👵 Dida (Oral History)</text>
      <text x="10" y="34" font-size="9" fill="#FFF">📖 1968 Colliery Lore</text>
      <text x="10" y="48" font-size="9" fill="#FFCC80">📖 Passport Stamp #5</text>
    </g>
  </g>

  <!-- EXPANSION GATEWAYS -->
  <g transform="translate(1010, 480)">
    <rect x="-60" y="-20" width="120" height="40" rx="6" fill="#1F2937" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" font-size="9" font-weight="700" fill="#E5E7EB">EXPANSION GATE</text>
    <text x="0" y="15" text-anchor="middle" font-size="8" fill="#9CA3AF">Jharia ➔ Sindri (Phase 2)</text>
  </g>

  <!-- MAP LEGEND -->
  <g transform="translate(40, 570)">
    <rect width="210" height="95" rx="8" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <text x="12" y="20" font-size="11" font-weight="800" fill="#FFD54F">LEGEND & SYSTEM KEYS</text>
    <circle cx="20" cy="38" r="5" fill="#FF1744"/>
    <text x="32" y="42" font-size="9" fill="#FFF">P0 Hero Pandal Zone</text>
    <circle cx="20" cy="56" r="5" fill="#00E5FF"/>
    <text x="32" y="60" font-size="9" fill="#FFF">Mega Mela & Rides Loop</text>
    <circle cx="20" cy="74" r="5" fill="#76FF03"/>
    <text x="32" y="78" font-size="9" fill="#FFF">Traditional Artisan Quarter</text>
  </g>
</svg>
