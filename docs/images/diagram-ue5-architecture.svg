<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="100%" height="100%">
  <defs>
    <linearGradient id="ueBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="50%" stop-color="#0E1729"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>

    <linearGradient id="ueTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#76FF03"/>
    </linearGradient>

    <!-- Column Gradients -->
    <linearGradient id="renderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E1B38" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="simGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#102035" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="audioGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2B1D12" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="gameplayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#76FF03" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#142616" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glowSmall" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1100" height="720" fill="url(#ueBg)"/>

  <!-- Grid Overlay -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="120" x2="1100" y2="120"/>
    <line x1="0" y1="240" x2="1100" y2="240"/>
    <line x1="0" y1="360" x2="1100" y2="360"/>
    <line x1="0" y1="480" x2="1100" y2="480"/>
    <line x1="0" y1="600" x2="1100" y2="600"/>
  </g>

  <!-- Title Header -->
  <rect x="30" y="25" width="1040" height="65" rx="10" fill="#111B30" stroke="#FFB300" stroke-width="1.5"/>
  <text x="50" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" fill="url(#ueTitleGrad)">
    ⚙️ UNREAL ENGINE 5 & WEB RUNTIME TECHNICAL ARCHITECTURE
  </text>
  <text x="760" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">
    SYSTEM INTEGRITY & MULTI-TIER PIPELINE
  </text>

  <!-- 4 PRIMARY ARCHITECTURAL PILLARS -->

  <!-- PILLAR 1: RENDERING & VISUAL ATMOSPHERE -->
  <g transform="translate(40, 110)">
    <rect width="235" height="490" rx="10" fill="url(#renderGrad)" stroke="#FF1744" stroke-width="1.8"/>
    <rect width="235" height="40" rx="10" fill="#FF1744" opacity="0.85"/>
    <text x="117" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFF">
      1. RENDERING & VFX
    </text>

    <!-- Block A: Nanite & Geometry -->
    <g transform="translate(15, 55)">
      <rect width="205" height="70" rx="6" fill="#1C1524" stroke="#FF5252" stroke-width="1"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#FF8A80">Nanite / High-Poly Meshes</text>
      <text x="10" y="38" font-size="9" fill="#E0E0E0">• Pandal tiered Chala roofs</text>
      <text x="10" y="52" font-size="9" fill="#E0E0E0">• Ornate Alpona & Brocade kits</text>
    </g>

    <!-- Block B: Lumen & Dynamic Lights -->
    <g transform="translate(15, 135)">
      <rect width="205" height="90" rx="6" fill="#1C1524" stroke="#FF5252" stroke-width="1"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#FF8A80">Lumen Global Illumination</text>
      <text x="10" y="38" font-size="9" fill="#E0E0E0">• Festival Pulse (16:30 - 23:00)</text>
      <text x="10" y="52" font-size="9" fill="#E0E0E0">• 40m LED Tunnel chasing waves</text>
      <text x="10" y="66" font-size="9" fill="#E0E0E0">• Multi-color Jhula neon rim</text>
      <text x="10" y="80" font-size="9" fill="#E0E0E0">• Flickering brass Diya fire</text>
    </g>

    <!-- Block C: Niagara VFX -->
    <g transform="translate(15, 235)">
      <rect width="205" height="70" rx="6" fill="#1C1524" stroke="#FF5252" stroke-width="1"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#FF8A80">Niagara Particle System</text>
      <text x="10" y="38" font-size="9" fill="#E0E0E0">• Dhoonuchi incense smoke</text>
      <text x="10" y="52" font-size="9" fill="#E0E0E0">• Victory confetti celebration</text>
    </g>

    <!-- Block D: Post-Processing -->
    <g transform="translate(15, 315)">
      <rect width="205" height="80" rx="6" fill="#1C1524" stroke="#FF5252" stroke-width="1"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#FF8A80">ACES Tone Mapping</text>
      <text x="10" y="38" font-size="9" fill="#E0E0E0">• Emissive Bloom threshold</text>
      <text x="10" y="52" font-size="9" fill="#E0E0E0">• Atmospheric Night Fog</text>
      <text x="10" y="66" font-size="9" fill="#E0E0E0">• Volumetric camera dust motes</text>
    </g>

    <g transform="translate(15, 405)">
      <rect width="205" height="65" rx="6" fill="#2A141A" stroke="#FF1744" stroke-width="1"/>
      <text x="10" y="22" font-size="11" font-weight="700" fill="#FF8A80">Target Performance</text>
      <text x="10" y="42" font-size="10" font-weight="600" fill="#76FF03">PC: 60 FPS (16.7 ms)</text>
      <text x="10" y="56" font-size="10" font-weight="600" fill="#FFD54F">Mobile: 30 FPS (ASTC)</text>
    </g>
  </g>

  <!-- PILLAR 2: AI & 3-TIER CROWD SIMULATION -->
  <g transform="translate(305, 110)">
    <rect width="235" height="490" rx="10" fill="url(#simGrad)" stroke="#00E5FF" stroke-width="1.8"/>
    <rect width="235" height="40" rx="10" fill="#00E5FF" opacity="0.85"/>
    <text x="117" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#000">
      2. AI & CROWD DIRECTOR
    </text>

    <!-- Tier 1: Hero NPCs -->
    <g transform="translate(15, 55)">
      <rect width="205" height="85" rx="6" fill="#0C1B2C" stroke="#00E5FF" stroke-width="1"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#80D8FF">Tier 1: 5 Authored Hero NPCs</text>
      <text x="10" y="38" font-size="9" fill="#FFF">• StateTree / Behavior Trees</text>
      <text x="10" y="52" font-size="9" fill="#FFF">• Aheli, Madan da, Imran,</text>
      <text x="10" y="66" font-size="9" fill="#FFF">  Rupa, Dida</text>
      <text x="10" y="78" font-size="9" fill="#80D8FF">• Floating quest indicators</text>
    </g>

    <!-- Tier 2: Nearby Crowd -->
    <g transform="translate(15, 150)">
      <rect width="205" height="95" rx="6" fill="#0C1B2C" stroke="#00E5FF" stroke-width="1"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#80D8FF">Tier 2: Nearby Agents (40-100)</text>
      <text x="10" y="38" font-size="9" fill="#FFF">• RVO Local Avoidance</text>
      <text x="10" y="52" font-size="9" fill="#FFF">• NavMesh waypoint wandering</text>
      <text x="10" y="66" font-size="9" fill="#FFF">• Diverse festive clothing kits</text>
      <text x="10" y="80" font-size="9" fill="#FFF">• Procedural walk cycles</text>
