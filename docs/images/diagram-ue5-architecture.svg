      <rect width="205" height="130" rx="6" fill="#091524" stroke="#00E5FF" stroke-width="1"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#80D8FF">Accessibility Crowd Modes</text>
      <text x="10" y="40" font-size="9" fill="#FFF">🌱 <b>Low (Quiet Mode):</b> 8 agents</text>
      <text x="10" y="56" font-size="9" fill="#FFF">🌿 <b>Medium Mode:</b> 18 agents</text>
      <text x="10" y="72" font-size="9" fill="#FFF">🔥 <b>High (Festival Rush):</b> 34+ agents</text>
      <text x="10" y="92" font-size="9" fill="#FFD54F">🛡️ Safe flow: No blocked gates</text>
      <text x="10" y="108" font-size="9" fill="#FFD54F">🛡️ Step-free alternative route</text>
