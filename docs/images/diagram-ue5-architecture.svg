    <!-- MetaSounds / Synthesizer -->
    <g transform="translate(15, 55)">
      <rect width="205" height="95" rx="6" fill="#1C1814" stroke="#FFB300" stroke-width="1"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#FFE082">Procedural Dhak Synthesizer</text>
      <text x="10" y="38" font-size="9" fill="#FFF">• Triangle wave bass (Dha: 45Hz)</text>
      <text x="10" y="52" font-size="9" fill="#FFF">• Bandpass rim burst (Tak: 1.2kHz)</text>
      <text x="10" y="66" font-size="9" fill="#FFF">• Kanshi brass bell FM chime</text>
      <text x="10" y="80" font-size="9" fill="#FFE082">• Authentic 140 BPM Puja beat</text>
    </g>

    <!-- 3D Proximity Attenuation -->
    <g transform="translate(15, 160)">
      <rect width="205" height="75" rx="6" fill="#1C1814" stroke="#FFB300" stroke-width="1"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#FFE082">Spatial 3D Attenuation</text>
      <text x="10" y="38" font-size="9" fill="#FFF">• Max gain at Pandal (z = -62)</text>
      <text x="10" y="52" font-size="9" fill="#FFF">• Linear falloff across 120m</text>
      <text x="10" y="66" font-size="9" fill="#FFF">• 4-layer audio bed mixing</text>
    </g>

    <!-- Native Web Speech Hindi Voice Engine -->
    <g transform="translate(15, 245)">
      <rect width="205" height="115" rx="6" fill="#1C1814" stroke="#FFB300" stroke-width="1"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#FFE082">Native Hindi Voice (hi-IN)</text>
      <text x="10" y="38" font-size="9" fill="#FFF">• Web Speech API synthesis</text>
      <text x="10" y="52" font-size="9" fill="#FFF">• Distinct emotional pitch tunings</text>
      <text x="10" y="66" font-size="9" fill="#FFF">• Aheli (1.15p), Madan da (0.88p),</text>
      <text x="10" y="80" font-size="9" fill="#FFF">  Imran (1.05p), Dida (0.92p)</text>
      <text x="10" y="96" font-size="9" fill="#00E5FF">• Live visual voice wave bars</text>
    </g>

    <!-- Mela Loudspeaker PA -->
    <g transform="translate(15, 370)">
      <rect width="205" height="100" rx="6" fill="#1C1814" stroke="#FFB300" stroke-width="1"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#FFE082">Loudspeaker PA Broadcast</text>
      <text x="10" y="38" font-size="9" fill="#FFF">• Automated 65s announcements</text>
      <text x="10" y="52" font-size="9" fill="#FFF">• "धनबाद हाउसिंग कॉलोनी..."</text>
      <text x="10" y="66" font-size="9" fill="#FFF">• "मेगा मेले का जाइंट व्हील..."</text>
      <text x="10" y="80" font-size="9" fill="#FFF">• "संध्या महाआरती का समय..."</text>
    </g>
  </g>

  <!-- PILLAR 4: GAMEPLAY, RIDES & STATE MACHINES -->
  <g transform="translate(835, 110)">
    <rect width="225" height="490" rx="10" fill="url(#gameplayGrad)" stroke="#76FF03" stroke-width="1.8"/>
    <rect width="225" height="40" rx="10" fill="#76FF03" opacity="0.9"/>
    <text x="112" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#000">
      4. GAMEPLAY & STATE
