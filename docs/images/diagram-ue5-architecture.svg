    <!-- Enhanced Input -->
    <g transform="translate(12, 55)">
      <rect width="200" height="70" rx="6" fill="#122014" stroke="#76FF03" stroke-width="1"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#B9F6CA">Enhanced Input Mapping</text>
      <text x="10" y="38" font-size="9" fill="#FFF">• WASD / Arrows / Shift sprint</text>
      <text x="10" y="52" font-size="9" fill="#FFF">• Virtual touch analog joystick</text>
    </g>

    <!-- Ride State Machine -->
    <g transform="translate(12, 135)">
      <rect width="200" height="110" rx="6" fill="#122014" stroke="#76FF03" stroke-width="1"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#B9F6CA">Jhula Ride State Machine</text>
      <text x="10" y="38" font-size="9" fill="#FFF">• IDLE ➔ BOARDING</text>
      <text x="10" y="52" font-size="9" fill="#FFF">• 24m Scenic Orbit (18s loop)</text>
      <text x="10" y="66" font-size="9" fill="#FFF">• Camera attaches to gondola</text>
      <text x="10" y="80" font-size="9" fill="#FFF">• Gravitational auto-leveling</text>
      <text x="10" y="96" font-size="9" fill="#B9F6CA">• EXITING ➔ COMPLETE</text>
    </g>

    <!-- Mini-games Engine -->
    <g transform="translate(12, 255)">
      <rect width="200" height="100" rx="6" fill="#122014" stroke="#76FF03" stroke-width="1"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#B9F6CA">Interactive Mini-Games</text>
      <text x="10" y="38" font-size="9" fill="#FFF">🥁 Dhak Rhythm Challenge</text>
      <text x="10" y="52" font-size="9" fill="#FFF">🎯 Ring Toss Fairground Game</text>
      <text x="10" y="66" font-size="9" fill="#FFF">🪷 Sanctum Pushpanjali Ritual</text>
      <text x="10" y="80" font-size="9" fill="#FFF">🍯 Sweet Delivery Service</text>
    </g>

    <!-- Save & Persistence -->
    <g transform="translate(12, 365)">
      <rect width="200" height="105" rx="6" fill="#122014" stroke="#76FF03" stroke-width="1"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#B9F6CA">SaveService / LocalStorage</text>
      <text x="10" y="38" font-size="9" fill="#FFF">• Stable String IDs</text>
      <text x="10" y="52" font-size="9" fill="#FFF">• 5 Lights completion flags</text>
      <text x="10" y="66" font-size="9" fill="#FFF">• 5 District stamp hashes</text>
      <text x="10" y="80" font-size="9" fill="#FFF">• Token wallet & settings</text>
      <text x="10" y="96" font-size="9" fill="#76FF03">🔒 Zero personally identifiable data</text>
    </g>
  </g>

  <!-- Bottom Data Bus Flow Arrow -->
  <g transform="translate(550, 650)">
    <rect x="-480" y="0" width="960" height="40" rx="20" fill="#18233C" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="0" y="24" text-anchor="middle" font-size="12" font-weight="800" fill="#FFD54F">
      DATA FLOW: Input ➔ Event Bus ➔ Quest Graph ➔ State Update ➔ WebGL Scene ➔ Web Audio &amp; Voice Synthesis
    </text>
