    <rect width="235" height="40" rx="10" fill="#FFB300" opacity="0.9"/>
    <text x="117" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#000">
      3. AUDIO & HINDI VOICE
