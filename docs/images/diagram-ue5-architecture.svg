      <rect width="205" height="75" rx="6" fill="#0C1B2C" stroke="#00E5FF" stroke-width="1"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#80D8FF">Tier 3: Far Crowd (100-400)</text>
      <text x="10" y="38" font-size="9" fill="#FFF">• GPU Instanced Meshes</text>
      <text x="10" y="52" font-size="9" fill="#FFF">• Static impostor billboards</text>
      <text x="10" y="66" font-size="9" fill="#FFF">• 0 ms physics overhead</text>
    </g>

    <!-- Low Crowd Toggle -->
